<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/userLayout}">
<head>
    <title layout:fragment="title">add task</title>
</head>
<body>
<main layout:fragment="content">
    <article>
        <h3>add task</h3>
        <form action="/add-task" th:object="${task}" method="post">
            Task: <input type="text" th:field="*{content}"/>
            <input type="submit" value="Submit"/>
            <a role="button" href="/">Cancel</a>
        </form>
    </article>
</main>
</body>
</html>
